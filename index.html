<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        main {
            width: min(90vw, 420px);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        #violated-rules-password,
        #violated-rules-email {
            margin: 12px 0 0;
            padding-left: 20px;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
        }

        #valid-email,
        #valid-password {
            margin: 12px 0 0;
            padding-left: 20px;
            color: #26dc51;
            font-size: 14px;
            line-height: 1.5;
        }

        .button {
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <main>

        <label for="email">Email</label>

        <input id="email" type="text" placeholder="Enter an email">

        <ul id="violated-rules-email"></ul>

        <p id="valid-email"></p>

        <label for="password">Password</label>

        <input id="password" type="password" placeholder="Enter a password">

        <button type="button" id="show-password-button">Show password</button>

        <ul id="violated-rules-password"></ul>
        
        <p id="valid-password"></p>
    </main>

    <script>
        const emailInput = document.querySelector("#email");
        const violatedRulesEmail = document.querySelector("#violated-rules-email");
        const validEmail = document.querySelector("#valid-email");
        window.violatedEmailRulesList = [];

        emailInput.addEventListener("input", async() => {
            const response = await fetch(
                `http://localhost:8080/violated-email-rules?email=${encodeURIComponent(emailInput.value)}`
            );

            window.violatedEmailRulesList = await response.json();
            violatedRulesEmail.innerHTML = "";
            validEmail.innerHTML = "";

            for(let i = 0; i < window.violatedEmailRulesList.length; i++){
                const rule = document.createElement("li");
                rule.textContent = window.violatedEmailRulesList[i];
                violatedRulesEmail.appendChild(rule);
            }

            if(window.violatedEmailRulesList.length < 1){
                validEmail.textContent = "Email is valid";
            }
        });

        
    </script>

    <script>
        const passwordInput = document.querySelector("#password");
        const violatedRules = document.querySelector("#violated-rules-password");
        const validPassword = document.querySelector("#valid-password");
        const showPasswordButton = document.querySelector("#show-password-button");
        window.violatedRulesList = [];

        passwordInput.addEventListener("input", async () => {
            const response = await fetch(
                `http://localhost:8080/violated-password-rules?password=${encodeURIComponent(passwordInput.value)}`
            );

            window.violatedRulesList = await response.json();
            violatedRules.innerHTML = "";
            validPassword.innerHTML = "";

            for (let i = 0; i < window.violatedRulesList.length; i++) {
                const rule = document.createElement("li");
                rule.textContent = window.violatedRulesList[i];
                violatedRules.appendChild(rule);
            }

            if(window.violatedRulesList.length < 1){
                validPassword.textContent = "Password is valid";
            }

        });

        showPasswordButton.addEventListener("click", () => {
                passwordInput.type = "text";
            });
    </script>
</body>
</html>
