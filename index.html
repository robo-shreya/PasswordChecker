<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        main {
            width: min(90vw, 420px);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        #violated-rules {
            margin: 12px 0 0;
            padding-left: 20px;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter a password">
        <ul id="violated-rules"></ul>
    </main>

    <script>
        const passwordInput = document.querySelector("#password");
        const violatedRules = document.querySelector("#violated-rules");
        window.violatedRulesList = [];

        passwordInput.addEventListener("input", async () => {
            const response = await fetch(
                `http://localhost:8080/violated-rules?password=${encodeURIComponent(passwordInput.value)}`
            );

            window.violatedRulesList = await response.json();
            violatedRules.innerHTML = "";

            for (let i = 0; i < window.violatedRulesList.length; i++) {
                const rule = document.createElement("li");
                rule.textContent = window.violatedRulesList[i];
                violatedRules.appendChild(rule);
            }
        });
    </script>
</body>
</html>
